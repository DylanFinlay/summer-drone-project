vision_node:
  ros__parameters:
    camera_index: 0
    camera_backend: auto
    video_file: ''
    loop_video: false
    frame_width: 640
    frame_height: 480
    fps: 20
    enable_object_detection: true
    detector_model: yolo11n.pt
    detector_device: cpu
    detector_confidence: 0.55
    detector_iou: 0.5
    detector_image_size: 320
    person_class_id: 0
    require_single_person: true
    acquire_confirm_frames: 3
    acquire_iou_threshold: 0.3
    lock_iou_threshold: 0.15
    ambiguity_iou_margin: 0.05
    max_missed_frames: 5
    # Experimental and opt-in. Reuses one YOLO pose model for both person
    # boxes and body keypoints instead of loading a second vision framework.
    enable_gesture_recognition: false
    gesture_pose_model: yolo11n-pose.pt
    gesture_min_keypoint_confidence: 0.55
    gesture_confirm_frames: 4

tracking_bridge_node:
  ros__parameters:
    # Overridden by the launch argument. Options: hover, active_track,
    # gesture_control. Keep hover as the power-on default.
    autonomy_mode: hover
    enable_gesture_control: false
    target_box_height: 0.35
    # Filter alpha weights each new detection; 1.0 disables smoothing.
    tracking_filter_alpha: 0.35
    # Normalized image-centre and box-height error deadbands.
    yaw_error_deadband: 0.04
    forward_error_deadband: 0.025
    k_p_yaw: 1.2
    k_p_forward: 1.5
    max_linear_speed: 0.35
    max_angular_speed: 0.4
    # Acceleration limits apply during valid autonomous motion. Safety stops
    # bypass ramping and publish zero immediately.
    max_linear_acceleration: 0.5  # metres per second squared
    max_yaw_acceleration: 0.8  # radians per second squared
    acceleration_limiter_max_dt_sec: 0.1  # timer-delay protection
    gesture_speed: 0.25
    target_timeout_sec: 0.5
    # Time allowed to reacquire after stopping on an explicitly missing target.
    target_loss_grace_sec: 0.75
    gesture_timeout_sec: 0.3
    command_rate_hz: 20
    # Disabled until a spare receiver channel is calibrated on the aircraft.
    # Low/middle hold hover; only a confirmed high requests active tracking.
    enable_rc_aux_mode_selection: false
    rc_aux_channel: 0
    rc_aux_low_max_pwm: 1300
    rc_aux_high_min_pwm: 1700
    rc_aux_confirm_samples: 3
    rc_aux_timeout_sec: 0.5
    rc_aux_low_mode: hover
    rc_aux_middle_mode: hover
    rc_aux_high_mode: active_track

safety_supervisor_node:
  ros__parameters:
    watchdog_timeout_sec: 0.5
    min_safety_box_height: 0.85

fc_interface_node:
  ros__parameters:
    command_rate_hz: 20
    command_timeout_sec: 0.5
    state_timeout_sec: 2.0
    require_guided_mode: true
    require_armed: true

status_node:
  ros__parameters:
    publish_rate_hz: 2.0
    # Component heartbeat age after which status becomes stale/unknown.
    input_timeout_sec: 2.0
